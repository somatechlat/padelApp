services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: padel
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padel_dev
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./docker/backend:/app/runsecrets:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    depends_on:
      - db
      - redis
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A padel worker -l info
    restart: unless-stopped
    volumes:
      - ./docker/backend:/app/runsecrets:ro
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: {}
  media_data: {}
  static_data: {}
