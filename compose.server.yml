services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: padel_prod
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-padel_prod_strong}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padel_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - padelapp-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - padelapp-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    volumes:
      - ./docker/backend:/app/runsecrets:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - padelapp-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A padel worker -l info
    restart: unless-stopped
    volumes:
      - ./docker/backend:/app/runsecrets:ro
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    depends_on:
      - backend
    networks:
      - padelapp-net

  beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A padel beat -l info
    restart: unless-stopped
    volumes:
      - ./docker/backend:/app/runsecrets:ro
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    depends_on:
      - backend
    networks:
      - padelapp-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
    ports:
      - "34003:80"
    depends_on:
      - backend
    networks:
      - padelapp-net

networks:
  padelapp-net:
    driver: bridge

volumes:
  db_data: {}
  media_data: {}
  static_data: {}
