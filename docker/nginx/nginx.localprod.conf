# localprod TLS terminator.
#
# Production terminates TLS in the host vhost (/etc/nginx/sites-enabled/padelapp)
# and proxies to this nginx over plain http — which is why the shipped
# nginx.conf sends X-Forwarded-Proto https unconditionally. There is no host
# vhost on a laptop, so this variant terminates TLS itself with the self-signed
# certificate from `make certs-localprod` and derives the scheme from $scheme,
# keeping Django's SECURE_SSL_REDIRECT and Secure cookies honest.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 443 ssl;
        server_name local.andespadel.test localhost;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 20M;

        location /static/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /media/;
            expires 7d;
        }

        # Store listings point at /privacy (no extension). Serve the policy
        # there explicitly so Apple/Google review does not hit a 404.
        location = /privacy {
            root /usr/share/nginx/html/landing;
            try_files /privacy.html =404;
        }

        location / {
            root /usr/share/nginx/html/landing;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Everything the app serves through the backend: the API, both admin
        # surfaces and the Stripe webhook.
        location ~ ^/(api|adminpanel|admin|django-admin|webhooks)/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }
}
