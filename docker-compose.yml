# Andes Padel — base cluster services (shared).
# Do not run this file alone. Always pair with an overlay:
#   docker compose -p andespadel      -f docker-compose.yml -f docker-compose.dev.yml  up -d
#   docker compose -p andespadel-test -f docker-compose.yml -f docker-compose.test.yml up -d
#   docker compose -p andespadel-prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# See docs/DEPLOYMENTS.md for ports, settings, and rules.

services:
  db:
    image: postgres:15-alpine
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_DB: padel
      POSTGRES_USER: padel
      # The password is a mounted secret, not an env var: env shows up in
      # `docker inspect` and /proc/*/environ. Postgres reads it from the file.
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets:
      - db-password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-padel} -d $${POSTGRES_DB:-padel}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - padel-net

  redis:
    image: redis:7-alpine
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - padel-net

    # `.:/app` lives in the dev/test overlays, NOT here. Mounting the host
    # source over /app shadows the code baked into the image, and the host
    # checkout is owned by the deploying uid while the image runs as `appuser`
    # — so beat cannot even write celerybeat-schedule. Prod must run the image.

  backend:
    image: ${BACKEND_IMAGE:-andespadel-backend:dev}
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: 768m
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped
    secrets:
      - secret-key
      - db-password
      - stripe-secret-key
      - stripe-publishable-key
      - stripe-webhook-secret
      - firebase-credentials
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-padel.settings.dev}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/courts/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - padel-net

  worker:
    image: ${BACKEND_IMAGE:-andespadel-backend:dev}
    mem_limit: 512m
    command: celery -A padel worker -l info --concurrency=2
    restart: unless-stopped
    secrets:
      - secret-key
      - db-password
      - stripe-secret-key
      - stripe-publishable-key
      - stripe-webhook-secret
      - firebase-credentials
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-padel.settings.dev}
    depends_on:
      backend:
        condition: service_started
    networks:
      - padel-net

  beat:
    image: ${BACKEND_IMAGE:-andespadel-backend:dev}
    mem_limit: 256m
    command: celery -A padel beat -l info
    restart: unless-stopped
    secrets:
      - secret-key
      - db-password
      - stripe-secret-key
      - stripe-publishable-key
      - stripe-webhook-secret
      - firebase-credentials
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-padel.settings.dev}
    depends_on:
      backend:
        condition: service_started
    networks:
      - padel-net

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./landing:/usr/share/nginx/html/landing:ro
      - static_data:/static:ro
      - media_data:/media:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - padel-net

  flutter:
    image: ghcr.io/cirruslabs/flutter:3.27.3
    mem_limit: 1024m
    working_dir: /mobile
    profiles: ["tools"]
    environment:
      PUB_CACHE: /home/cirrus/.pub-cache
      API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:28002/api}
    volumes:
      - ./mobile:/mobile
      - flutter_home:/home/cirrus
      - gradle_home:/root/.gradle
      - android_sdk:/opt/android-sdk-linux
    networks:
      - padel-net
    stdin_open: true
    tty: true

networks:
  padel-net:
    driver: bridge

# One file per secret under ./docker/runsecrets (gitignored; `make secrets-init`
# generates real random values). Compose mounts each at /run/secrets/<key>,
# which is where padel.settings._secrets reads them from. Nothing here is an
# environment variable, so `docker inspect` shows no credentials.
secrets:
  secret-key:
    file: ./docker/runsecrets/secret-key
  db-password:
    file: ./docker/runsecrets/db-password
  stripe-secret-key:
    file: ./docker/runsecrets/stripe-secret-key
  stripe-publishable-key:
    file: ./docker/runsecrets/stripe-publishable-key
  stripe-webhook-secret:
    file: ./docker/runsecrets/stripe-webhook-secret
  firebase-credentials:
    file: ./docker/runsecrets/firebase-service-account.json

volumes:
  db_data: {}
  media_data: {}
  static_data: {}
  flutter_home: {}
  gradle_home: {}
  android_sdk: {}
