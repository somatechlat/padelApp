# PROD overlay — project andespadel-prod, host ports 34000+ (matches server)
# Usage (server /opt/padelapp):
#   docker compose -p andespadel-prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NEVER touch loyallia-* or ports 33900-33914. See docs/DEPLOYMENTS.md and R18.

name: andespadel-prod

services:
  db:
    container_name: andespadel-prod-db
    environment:
      POSTGRES_DB: padel_prod
      POSTGRES_USER: padel
    ports:
      - "34000:5432"

  redis:
    container_name: andespadel-prod-redis
    ports:
      - "34001:6379"

  backend:
    container_name: andespadel-prod-backend
    image: ${BACKEND_IMAGE:-andespadel-backend:prod}
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn padel.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    secrets:
      # Base compose already mounts the common ones (secret_key, db_password,
      # stripe_*, firebase). These are the production-only values: the SMTP
      # relay, the From address and the bare apex the host allowlist is
      # derived from.
      - email-host
      - email-host-user
      - email-host-password
      - email-from
      - prod-domain
    ports:
      - "34002:8000"
    healthcheck:
      # The inherited probe sends Host: 127.0.0.1, which prod answers with a
      # 400 — ALLOWED_HOSTS is the domain allowlist, not a loopback — so the
      # backend has always reported unhealthy while serving fine. A plain http
      # probe would then be bounced to https by SECURE_SSL_REDIRECT. The Host
      # is read from Django settings at probe time: no env var and no literal
      # domain in this file, and prod.py is the only place a host is decided.
      test:
        [
          "CMD",
          "python",
          "-c",
          "from django.conf import settings; import urllib.request as u; h = next((x for x in settings.ALLOWED_HOSTS if x.startswith('app.')), settings.ALLOWED_HOSTS[0]); u.urlopen(u.Request('http://127.0.0.1:8000/api/courts/', headers={'Host': h, 'X-Forwarded-Proto': 'https'}), timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  worker:
    container_name: andespadel-prod-worker
    image: ${BACKEND_IMAGE:-andespadel-backend:prod}
    command: celery -A padel worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    secrets:
      # Base compose already mounts the common ones (secret_key, db_password,
      # stripe_*, firebase). These are the production-only values: the SMTP
      # relay, the From address and the bare apex the host allowlist is
      # derived from.
      - email-host
      - email-host-user
      - email-host-password
      - email-from
      - prod-domain

  beat:
    container_name: andespadel-prod-beat
    image: ${BACKEND_IMAGE:-andespadel-backend:prod}
    command: celery -A padel beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: padel.settings.prod
    secrets:
      # Base compose already mounts the common ones (secret_key, db_password,
      # stripe_*, firebase). These are the production-only values: the SMTP
      # relay, the From address and the bare apex the host allowlist is
      # derived from.
      - email-host
      - email-host-user
      - email-host-password
      - email-from
      - prod-domain

  nginx:
    container_name: andespadel-prod-nginx
    ports:
      - "34003:80"

  flutter:
    container_name: andespadel-prod-flutter
    environment:
      API_BASE_URL: ${PROD_API_BASE_URL:?set PROD_API_BASE_URL to the new production API URL}

networks:
  padel-net:
    name: andespadel-prod-net

# Production-only secrets. Same mechanism as the base file — one file per
# value under ./docker/runsecrets, mounted at /run/secrets/<key> — so nothing
# here is an environment variable and `docker inspect` shows no credentials.
secrets:
  email-host:
    file: ./docker/runsecrets/email-host
  email-host-user:
    file: ./docker/runsecrets/email-host-user
  email-host-password:
    file: ./docker/runsecrets/email-host-password
  email-from:
    file: ./docker/runsecrets/email-from
  prod-domain:
    file: ./docker/runsecrets/prod-domain

volumes:
  db_data:
    name: andespadel-prod_db_data
  media_data:
    name: andespadel-prod_media_data
  static_data:
    name: andespadel-prod_static_data
  flutter_home:
    name: andespadel-prod_flutter_home
  gradle_home:
    name: andespadel-prod_gradle_home
  android_sdk:
    name: andespadel-prod_android_sdk
