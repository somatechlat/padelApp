<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andes Pádel — Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #001219;
    --sidebar-bg: #001A2A;
    --card-bg: #001F2E;
    --border-color: #1A3A4A;
    --brand: #002F48;
    --brand-light: #3571B8;
    --accent: #CEDC29;
    --text-primary: #FFFFFF;
    --text-muted: #90A4AE;
    --accent-red: #D32F2F;
    --accent-yellow: #FFC107;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .login-container {
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }

  .login-brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-brand-badge {
    display: inline-block;
    background-color: var(--brand);
    color: var(--text-primary);
    font-weight: 900;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 8px;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .login-brand h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .login-brand p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 4px;
  }

  .login-card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 32px;
  }

  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .form-group input {
    width: 100%;
    background-color: var(--bg-dark);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-primary);
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    border-color: var(--brand-light);
    box-shadow: 0 0 0 2px rgba(53, 113, 184, 0.25);
  }
  .form-group input::placeholder {
    color: var(--text-muted);
  }

  .btn-login {
    width: 100%;
    background-color: var(--accent);
    color: #001A2A;
    font-weight: 800;
    font-size: 14px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-login:hover {
    background-color: #B8C825;
    transform: translateY(-1px);
  }

  /* Messages */
  .messages {
    margin-bottom: 20px;
  }
  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .alert-success { background: rgba(206, 220, 41, 0.15); border: 1px solid var(--accent); color: var(--accent); }
  .alert-error { background: rgba(211, 47, 47, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); }
  .alert-info { background: rgba(53, 113, 184, 0.15); border: 1px solid var(--brand-light); color: var(--brand-light); }

  .login-footer {
    text-align: center;
    margin-top: 24px;
    color: var(--text-muted);
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-brand">
    <div class="login-brand-badge">PRO</div>
    <h1>Andes Pádel</h1>
    <p>Panel de Administración</p>
  </div>

  <div class="login-card">
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="admin@andespadel.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>
  </div>

  <div class="login-footer">
    Andes Pádel v1.0.0 &bull; Quito, Ecuador
  </div>
</div>

</body>
</html>
